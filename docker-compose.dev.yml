services:
  php-fpm:
    depends_on:
      mailpit:
        condition: service_started
    environment:
      STRIPE_WEBHOOK_SECRET_FILE: /run/stripe-webhook/secret
    volumes:
      - stripe_webhook_secret:/run/stripe-webhook:ro

  messenger-worker:
    depends_on:
      mailpit:
        condition: service_started

  pgadmin:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: pgadmin
    image: dpage/pgadmin4:9.12.0
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  rabbitmq:
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_UI_PORT}:15672"

  clickhouse:
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CLICKHOUSE_API_PORT}:8123"
      - "${BIND_ADDRESS:-127.0.0.1}:${CLICKHOUSE_NATIVE_PORT}:9000"

  mailpit:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: mailpit
    image: axllent/mailpit:v1.29
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MAILPIT_PORT}:1025"
      - "${BIND_ADDRESS:-127.0.0.1}:${MAILPIT_INTERFACE_PORT}:8025"
    networks:
      - app-network

  minio:
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9005}:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"

  minio-init:
    container_name: minio-init
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-evogym-bucket}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app-network
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /usr/bin/mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        /usr/bin/mc mb --ignore-existing -p "local/$${MINIO_BUCKET}"
        /usr/bin/mc anonymous set none "local/$${MINIO_BUCKET}"
        echo 'MinIO is fully configured!'

  stripe-cli:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: stripe-cli
    image: stripe/stripe-cli:v1.43.6
    entrypoint:
      - /bin/sh
      - /usr/local/bin/stripe-listen.sh
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
      STRIPE_FORWARD_TO: http://nginx:8080/api/webhooks/stripe/
      STRIPE_WEBHOOK_SECRET_FILE: /run/stripe-webhook/secret
    volumes:
      - ./docker/stripe/listen.sh:/usr/local/bin/stripe-listen.sh:ro
      - stripe_webhook_secret:/run/stripe-webhook
    depends_on:
      nginx:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "test -s /run/stripe-webhook/secret" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - app-network

volumes:
  pgadmin_data:
  stripe_webhook_secret:

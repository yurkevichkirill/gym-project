nelmio_cors:
    paths:
        '^/api/':
            allow_origin: ['https://evogym.local']
            allow_credentials: true
            allow_headers: ['Accept', 'Authorization', 'Content-Type', 'Origin', 'X-Requested-With', 'X-CSRF-Token']
            allow_methods: ['POST', 'PUT', 'GET', 'DELETE', 'OPTIONS', 'PATCH']
            max_age: 3600

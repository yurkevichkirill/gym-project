security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\User\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            jwt: ~

    access_control:
        - { path: ^/api/membership/plans, methods: [ GET ], roles: PUBLIC_ACCESS }
        - { path: ^/api/trainers, methods: [ GET ], roles: PUBLIC_ACCESS }
        - { path: ^/api/trainers/[ ^/ ]+/worktime, methods: [ GET ], roles: PUBLIC_ACCESS }
        - { path: ^/api/training/types, methods: [ GET ], roles: PUBLIC_ACCESS }
        - { path: ^/api/webhooks/stripe, methods: [ POST ], roles: PUBLIC_ACCESS }

    role_hierarchy:
        ROLE_ADMIN:    [ROLE_CLIENT, ROLE_ADMIN]
        ROLE_CLIENT:   [ROLE_CLIENT]

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10

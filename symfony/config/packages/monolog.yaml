monolog:
    channels:
        - booking
        - payment
        - membership
        - security
        - stripe
        - rabbitmq
        - request
        - deprecation

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]

            stdout:
                type: stream
                path: php://stdout
                level: info
                formatter: monolog.formatter.json
                channels: ['!event', "!doctrine"]

            error:
                type: stream
                path: php://stderr
                level: error
                formatter: monolog.formatter.json

            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]


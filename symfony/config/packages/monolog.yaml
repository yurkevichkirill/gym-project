when@prod:
    monolog:
        handlers:
            main:
                type: stream
                path: php://stdout
                level: info
                formatter: monolog.formatter.json
                channels: ["!event", "!doctrine", "!console", "!booking", "!payment", "!membership", "!security", "!stripe", "!rabbitmq", "!request"]

            error:
                type: stream
                path: php://stderr
                level: error
                formatter: monolog.formatter.json

            booking:
                type: stream
                path: php://stdout
                level: info
                formatter: monolog.formatter.json
                channels: ["booking"]

            payment:
                type: stream
                path: php://stdout
                level: info
                formatter: monolog.formatter.json
                channels: ["payment"]

            membership:
                type: stream
                path: php://stdout
                level: info
                formatter: monolog.formatter.json
                channels: ["membership"]

            security:
                type: stream
                path: php://stdout
                level: info
                formatter: monolog.formatter.json
                channels: ["security"]

            stripe:
                type: stream
                path: php://stdout
                level: info
                formatter: monolog.formatter.json
                channels: ["stripe"]

            rabbitmq:
                type: stream
                path: php://stdout
                level: info
                formatter: monolog.formatter.json
                channels: ["rabbitmq"]

            request:
                type: stream
                path: php://stdout
                level: info
                formatter: monolog.formatter.json
                channels: ["request"]

            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json

            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]

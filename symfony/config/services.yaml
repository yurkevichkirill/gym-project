# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own utils.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for utils in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your utils.
        autoconfigure: true # Automatically registers your utils as commands, event subscribers, etc.
    # makes classes in src/ available to be used as utils
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\EventListener\CacheInvalidatorListener:
        tags:
            -
                name: 'doctrine.event_listener'
                event: 'onFlush'

    Gedmo\Mapping\Driver\AttributeReader: ~

    Gedmo\SoftDeleteable\SoftDeleteableListener:
        class: Gedmo\SoftDeleteable\SoftDeleteableListener
        tags:
            - { name: doctrine.event_listener, event: 'onFlush' }
            - { name: doctrine.event_listener, event: 'loadClassMetadata' }
        calls:
            - [ setAnnotationReader, ['@Gedmo\Mapping\Driver\AttributeReader'] ]

    App\Payment\Service\StripeService:
        arguments:
            $stripeSecretKey: '%env(STRIPE_SECRET_KEY)%'
            $stripeLogger: '@monolog.logger.stripe'

    App\Booking\Service\BookingManager:
        arguments:
            $bookingLogger: '@monolog.logger.booking'

    App\Payment\Service\PaymentService:
        arguments:
            $paymentLogger: '@monolog.logger.payment'

    App\Membership\Service\MembershipManager:
        arguments:
            $membershipLogger: '@monolog.logger.membership'

    App\TrainerWorkTime\Service\WorkTimeManager:
        arguments:
            $worktimeLogger: '@monolog.logger.worktime'

    App\Membership\Service\VisitingService:
        arguments:
            $membershipLogger: '@monolog.logger.membership'


    App\ImportJob\Service\ImportService:
        arguments:
            $clientLogger: '@monolog.logger.client'

    App\ImportJob\MessageHandler\ImportHandler:
        arguments:
            $clientLogger: '@monolog.logger.client'

    App\Payment\Service\StripeWebhookService:
        arguments:
            $webhookSecret: '%env(STRIPE_WEBHOOK_SECRET)%'
            $logger: '@monolog.logger.stripe'

    App\Logging\RequestCorrelationProcessor:
        tags:
            - { name: monolog.processor }

    App\Subscriber\RequestLoggingSubscriber:
        arguments:
            $requestLogger: '@monolog.logger.request'

    App\EventListener\ExceptionListener:
        arguments:
            $requestLogger: '@monolog.logger.request'

    App\Infrastructure\ClickHouse\ClickHouseClient:
        arguments:
            $host: '%env(CLICKHOUSE_HOST)%'
            $database: '%env(CLICKHOUSE_DB)%'
            $user: '%env(CLICKHOUSE_USER)%'
            $password: '%env(CLICKHOUSE_PASSWORD)%'

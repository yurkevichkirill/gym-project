# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own utils.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for utils in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your utils.
        autoconfigure: true # Automatically registers your utils as commands, event subscribers, etc.
        bind:
            $authCookieDomain: '%env(resolve:AUTH_COOKIE_DOMAIN)%'
    # makes classes in src/ available to be used as utils
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    Predis\ClientInterface:
        class: Predis\Client
        arguments:
            - '%env(resolve:REDIS_URL)%'

    App\Payment\Service\StripeService:
        arguments:
            $stripeSecretKey: '%env(STRIPE_SECRET_KEY)%'
            $stripeLogger: '@monolog.logger.stripe'

    App\Booking\Service\BookingManager:
        arguments:
            $bookingLogger: '@monolog.logger.booking'

    App\Training\Service\TrainingManager:
        arguments:
            $bookingLogger: '@monolog.logger.booking'

    App\Booking\Service\BookingCancellationService:
        arguments:
            $bookingLogger: '@monolog.logger.booking'

    App\Payment\Service\PaymentSettlementService:
        arguments:
            $paymentLogger: '@monolog.logger.payment'

    App\Membership\Service\MembershipManager:
        arguments:
            $membershipLogger: '@monolog.logger.membership'

    App\TrainerWorkTime\Service\WorkTimeManager:
        arguments:
            $worktimeLogger: '@monolog.logger.worktime'

    App\Membership\Service\VisitingService:
        arguments:
            $membershipLogger: '@monolog.logger.membership'

    App\ImportJob\MessageHandler\ImportHandler:
        arguments:
            $clientLogger: '@monolog.logger.client'

    App\Payment\Service\StripeWebhookService:
        arguments:
            $webhookSecret: '%env(STRIPE_WEBHOOK_SECRET)%'
            $logger: '@monolog.logger.stripe'

    App\Logging\RequestCorrelationProcessor:
        tags:
            - { name: monolog.processor }

    App\EventListener\ExceptionListener:
        arguments:
            $requestLogger: '@monolog.logger.request'

    App\Infrastructure\ClickHouse\ClickHouseClient:
        arguments:
            $host: '%env(CLICKHOUSE_HOST)%'
            $database: '%env(CLICKHOUSE_DB)%'
            $user: '%env(CLICKHOUSE_USER)%'
            $password: '%env(CLICKHOUSE_PASSWORD)%'

    Aws\S3\S3Client:
        arguments:
            -   endpoint: '%env(MINIO_ENDPOINT)%'
                credentials:
                    key: '%env(MINIO_ACCESS_KEY)%'
                    secret: '%env(MINIO_SECRET_KEY)%'
                region: 'us-east-1'
                version: 'latest'
                use_path_style_endpoint: true

    App\Security\AuthenticationRateLimiter:
        arguments:
            $secret: '%kernel.secret%'

    App\Contact\Security\ContactRateLimiter:
        arguments:
            $secret: '%kernel.secret%'

    App\Contact\Service\ContactMessageService:
        arguments:
            $recipientEmail: '%env(resolve:CONTACT_RECIPIENT_EMAIL)%'
            $senderEmail: '%env(resolve:CONTACT_SENDER_EMAIL)%'

    App\ImportJob\Service\ActivationEmailService:
        arguments:
            $clientActivationUrl: '%env(resolve:CLIENT_ACTIVATION_URL)%'

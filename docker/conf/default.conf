fastcgi_cache_path /var/cache/nginx/fastcgi levels=1:2 keys_zone=phpcache:10m max_size=10g inactive=60m;

map $http_cookie $has_access_token {
    default 0;
    "~*(^|;\s*)access_token=" 1;
}

map $request_method $cacheable_method {
    default 0;
    GET 1;
    HEAD 1;
}

# Only endpoints explicitly marked with Symfony #[Cache(public: true)] may reach FastCGI cache.
map $uri $public_cache_route {
    default 0;
    ~^/api/membership/plans/$ 1;
    ~^/api/trainers/$ 1;
    ~^/api/worktime/$ 1;
    ~^/api/training/types/$ 1;
}

server {
    listen 80;
    server_name api.evogym.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.evogym.local;

    ssl_certificate /etc/nginx/certs/evogym.local.pem;
    ssl_certificate_key /etc/nginx/certs/evogym.local-key.pem;

    root /var/www/public;

    resolver 127.0.0.11 ipv6=off;

    set $cache_version "unavailable";
    set $skip_fastcgi_cache "1";

    set_by_lua_block $cache_group {
        local uri = ngx.var.uri
        local m = ngx.re.match(uri, "^/api/([^/]+)")

        if m then
            return m[1]
        end

        return "default"
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        rewrite_by_lua_block {
            local redis = require "resty.redis"
            local red = redis:new()

            red:set_timeout(100)

            local ok, err = red:connect("redis", 6379)

            if not ok then
                ngx.log(ngx.ERR, "REDIS CONNECTION FAILED: ", err)
                return
            end

            local key = "cache_version:" .. ngx.var.cache_group
            local version, get_err = red:get(key)

            if get_err then
                ngx.log(ngx.ERR, "REDIS GET FAILED: ", get_err)
            else
                if version == ngx.null then
                    version = "0"
                end

                ngx.var.cache_version = "v" .. version

                if ngx.var.cacheable_method == "1"
                    and ngx.var.public_cache_route == "1"
                    and ngx.var.has_access_token == "0"
                then
                    ngx.var.skip_fastcgi_cache = "0"
                end
            end

            local keepalive_ok, keepalive_err = red:set_keepalive(10000, 100)
            if not keepalive_ok then
                ngx.log(ngx.WARN, "REDIS KEEPALIVE FAILED: ", keepalive_err)
            end
        }

        fastcgi_no_cache $skip_fastcgi_cache;
        fastcgi_cache_bypass $skip_fastcgi_cache;

        fastcgi_cache phpcache;
        fastcgi_cache_methods GET HEAD;
        fastcgi_cache_key "$scheme$host$request_uri$cache_version";
        fastcgi_cache_valid 200 302 10m;
        fastcgi_cache_valid 404 1m;

        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ \.php$ {
        return 404;
    }
}

server {
    listen 80;
    server_name evogym.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name evogym.local;

    ssl_certificate /etc/nginx/certs/evogym.local.pem;
    ssl_certificate_key /etc/nginx/certs/evogym.local-key.pem;

    resolver 127.0.0.11 ipv6=off;

    location / {
        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

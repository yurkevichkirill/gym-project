services:
  nginx:
    container_name: nginx
    image: openresty/openresty:1.29.2.1-alpine
    command: /bin/sh -c "mkdir -p /var/cache/nginx/fastcgi && openresty -g 'daemon off;'"
    volumes:
      - ./symfony:/var/www
      - ./docker/conf/default.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs
    ports:
      - "${NGINX_PORT}:80"
      - "${SECURE_NGINX_PORT}:443"
    restart: always
    depends_on:
      - php-fpm
      - postgres
    networks:
      - app-network

  php-fpm:
    container_name: php
    build:
      context: "docker/dockerfiles/php"
      dockerfile: Dockerfile
    restart: always
    working_dir: /var/www
    volumes:
      - ./symfony:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
       - XDEBUG_MODE=${XDEBUG_MODE}
       - XDEBUG_CONFIG=${XDEBUG_CONFIG}
       - XDEBUG_CLIENT_HOST=${XDEBUG_CLIENT_HOST}
       - PHP_IDE_CONFIG=${PHP_IDE_CONFIG}
    depends_on:
     - mailpit
    networks:
      - app-network

  postgres:
    container_name: postgres
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}" ]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./docker/db/data:/var/lib/postgresql/data:rw
    networks:
      - app-network

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:9.12.0
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - app-network

  redis:
    container_name: redis
    image: redis:8.6.0-alpine
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - app-network

  rabbitmq:
   container_name: rabbitmq
   image: rabbitmq:4.0-management-alpine
   restart: always
   ports:
     - "${RABBITMQ_AMQP_PORT}:5672"
     - "${RABBITMQ_UI_PORT}:15672"
   environment:
     RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
     RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
   volumes:
     - rabbitmq_data:/var/lib/rabbitmq
   networks:
     - app-network

  messenger-worker:
   container_name: messenger-worker
   build:
     context: "docker/dockerfiles/php"
     dockerfile: Dockerfile
   restart: always
   working_dir: /var/www
   command: >
     php bin/console messenger:consume async client_outbox
     --time-limit=3600
     --memory-limit=256M
     --limit=1000
     -vv
   volumes:
     - ./symfony:/var/www
   extra_hosts:
     - "host.docker.internal:host-gateway"
   environment:
      - XDEBUG_MODE=${XDEBUG_MODE}
      - XDEBUG_CONFIG=${XDEBUG_CONFIG}
      - XDEBUG_CLIENT_HOST=${XDEBUG_CLIENT_HOST}
      - PHP_IDE_CONFIG=${PHP_IDE_CONFIG}
   depends_on:
     - rabbitmq
     - postgres
     - mailpit
   networks:
     - app-network

  analytics-worker:
   container_name: analytics-worker
   build:
     context: "docker/dockerfiles/php"
     dockerfile: Dockerfile
   restart: always
   working_dir: /var/www
   command: >
     php bin/console messenger:consume analytics
     --time-limit=3600
     --memory-limit=256M
     --limit=1000
     -vv
   volumes:
     - ./symfony:/var/www
   extra_hosts:
     - "host.docker.internal:host-gateway"
   environment:
      - XDEBUG_MODE=${XDEBUG_MODE}
      - XDEBUG_CONFIG=${XDEBUG_CONFIG}
      - XDEBUG_CLIENT_HOST=${XDEBUG_CLIENT_HOST}
      - PHP_IDE_CONFIG=${PHP_IDE_CONFIG}
   depends_on:
     - rabbitmq
   networks:
     - app-network

  scheduler-worker:
    container_name: scheduler-worker
    build:
      context: "docker/dockerfiles/php"
      dockerfile: Dockerfile
    restart: always
    working_dir: /var/www
    command: >
      php bin/console messenger:consume scheduler_default scheduler_memberships
      --time-limit=3600
      --memory-limit=256M
      -vv
    volumes:
      - ./symfony:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - XDEBUG_MODE=${XDEBUG_MODE}
      - XDEBUG_CONFIG=${XDEBUG_CONFIG}
      - XDEBUG_CLIENT_HOST=${XDEBUG_CLIENT_HOST}
      - PHP_IDE_CONFIG=${PHP_IDE_CONFIG}
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - app-network

  payment-worker:
    build:
      context: "docker/dockerfiles/php"
      dockerfile: Dockerfile
    restart: always
    working_dir: /var/www
    command: >
      php bin/console messenger:consume payment_outbox
      --time-limit=3600
      --memory-limit=256M
      -vv
    volumes:
      - ./symfony:/var/www
    depends_on:
      - postgres
    networks:
      - app-network

  clickhouse:
   container_name: clickhouse
   image: clickhouse/clickhouse-server:25.8
   restart: always
   environment:
     CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
     CLICKHOUSE_USER: ${CLICKHOUSE_USER:?CLICKHOUSE_USER is required}
     CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
     CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
   ports:
     - "${CLICKHOUSE_API_PORT}:8123"
     - "${CLICKHOUSE_NATIVE_PORT}:9000"
   volumes:
     - clickhouse_data:/var/lib/clickhouse
     - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
   ulimits:
     nofile:
       soft: 262144
       hard: 262144
   networks:
     - app-network

  mailpit:
   image: axllent/mailpit:v1.29
   ports:
     - "$MAILPIT_PORT:1025"
     - "$MAILPIT_INTERFACE_PORT:8025"
   networks:
     - app-network

  minio:
    container_name: minio
    image: minio/minio:RELEASE.2024-03-07T00-43-48Z
    restart: always
    ports:
      - "${MINIO_API_PORT:-9005}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network

  minio-init:
    container_name: minio-init
    image: minio/mc:latest
    depends_on:
      - minio
    networks:
      - app-network
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to start...';
      sleep 3;
      
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required} ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required};
      
      /usr/bin/mc mb -p local/evogym-bucket;
      
      /usr/bin/mc anonymous set none local/evogym-bucket;
      
      echo 'MinIO is fully configured!';
      exit 0;
      "

  frontend:
    container_name: frontend
    build:
      context: "nextjs"
      dockerfile: ../docker/dockerfiles/node/Dockerfile
    restart: always
    ports:
      - "${NEXT_PORT}:3000"
    working_dir: /app
    volumes:
      - ./nextjs:/app
      - frontend_node_modules:/app/node_modules
      - pnpm-store:/app/.pnpm-store
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgadmin_data:
  frontend_node_modules:
  pnpm-store:
  rabbitmq_data:
  clickhouse_data:
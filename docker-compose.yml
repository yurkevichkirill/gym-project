x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging

services:
  nginx:
    <<: *service-defaults
    container_name: nginx
    image: openresty/openresty:1.29.2.1-alpine
    command: /bin/sh -c "mkdir -p /var/cache/nginx/fastcgi && openresty -g 'daemon off;'"
    volumes:
      - ./symfony:/var/www
      - ./docker/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${SECURE_NGINX_PORT}:443"
    depends_on:
      php-fpm:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - app-network

  php-fpm:
    <<: *service-defaults
    container_name: php
    build:
      context: "docker/dockerfiles/php"
      dockerfile: Dockerfile
    working_dir: /var/www
    volumes:
      - ./symfony:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CORS_ALLOW_ORIGIN: '^https://evogym\.local$'
      REDIS_URL: redis://redis:6379
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CONFIG: ${XDEBUG_CONFIG:-client_host=host.docker.internal}
      XDEBUG_CLIENT_HOST: ${XDEBUG_CLIENT_HOST:-host.docker.internal}
      PHP_IDE_CONFIG: ${PHP_IDE_CONFIG:-serverName=docker-cli}
    depends_on:
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    <<: *service-defaults
    container_name: postgres
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT}:5432"
    volumes:
      - ./docker/db/data:/var/lib/postgresql/data:rw
    networks:
      - app-network

  pgadmin:
    <<: *service-defaults
    container_name: pgadmin
    image: dpage/pgadmin4:9.12.0
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  redis:
    <<: *service-defaults
    container_name: redis
    image: redis:8.6.0-alpine
    command: [ "redis-server", "--appendonly", "yes", "--appendfsync", "everysec" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT}:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - app-network

  rabbitmq:
    <<: *service-defaults
    container_name: rabbitmq
    image: rabbitmq:4.0-management-alpine
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_AMQP_PORT}:5672"
      - "${BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_UI_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network

  messenger-worker:
    <<: *service-defaults
    container_name: messenger-worker
    build:
      context: "docker/dockerfiles/php"
      dockerfile: Dockerfile
    working_dir: /var/www
    command: >
      php bin/console messenger:consume async client_outbox cache_outbox
      --time-limit=3600
      --memory-limit=256M
      --limit=1000
      -vv
    volumes:
      - ./symfony:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CORS_ALLOW_ORIGIN: '^https://evogym\.local$'
      REDIS_URL: redis://redis:6379
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CONFIG: ${XDEBUG_CONFIG:-client_host=host.docker.internal}
      XDEBUG_CLIENT_HOST: ${XDEBUG_CLIENT_HOST:-host.docker.internal}
      PHP_IDE_CONFIG: ${PHP_IDE_CONFIG:-serverName=docker-cli}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - app-network

  analytics-worker:
    <<: *service-defaults
    container_name: analytics-worker
    build:
      context: "docker/dockerfiles/php"
      dockerfile: Dockerfile
    working_dir: /var/www
    command: >
      php bin/console messenger:consume analytics
      --time-limit=3600
      --memory-limit=256M
      --limit=1000
      -vv
    volumes:
      - ./symfony:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CORS_ALLOW_ORIGIN: '^https://evogym\.local$'
      REDIS_URL: redis://redis:6379
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CONFIG: ${XDEBUG_CONFIG:-client_host=host.docker.internal}
      XDEBUG_CLIENT_HOST: ${XDEBUG_CLIENT_HOST:-host.docker.internal}
      PHP_IDE_CONFIG: ${PHP_IDE_CONFIG:-serverName=docker-cli}
    depends_on:
      rabbitmq:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  scheduler-worker:
    <<: *service-defaults
    container_name: scheduler-worker
    build:
      context: "docker/dockerfiles/php"
      dockerfile: Dockerfile
    working_dir: /var/www
    command: >
      php bin/console messenger:consume scheduler_default scheduler_memberships
      --time-limit=3600
      --memory-limit=256M
      -vv
    volumes:
      - ./symfony:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CORS_ALLOW_ORIGIN: '^https://evogym\.local$'
      REDIS_URL: redis://redis:6379
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CONFIG: ${XDEBUG_CONFIG:-client_host=host.docker.internal}
      XDEBUG_CLIENT_HOST: ${XDEBUG_CLIENT_HOST:-host.docker.internal}
      PHP_IDE_CONFIG: ${PHP_IDE_CONFIG:-serverName=docker-cli}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  payment-worker:
    <<: *service-defaults
    container_name: payment-worker
    build:
      context: "docker/dockerfiles/php"
      dockerfile: Dockerfile
    working_dir: /var/www
    command: >
      php bin/console messenger:consume payment_outbox
      --time-limit=3600
      --memory-limit=256M
      -vv
    volumes:
      - ./symfony:/var/www
    environment:
      CORS_ALLOW_ORIGIN: '^https://evogym\.local$'
      REDIS_URL: redis://redis:6379
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  clickhouse:
    <<: *service-defaults
    container_name: clickhouse
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?CLICKHOUSE_USER is required}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CLICKHOUSE_API_PORT}:8123"
      - "${BIND_ADDRESS:-127.0.0.1}:${CLICKHOUSE_NATIVE_PORT}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - app-network

  mailpit:
    <<: *service-defaults
    container_name: mailpit
    image: axllent/mailpit:v1.29
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MAILPIT_PORT}:1025"
      - "${BIND_ADDRESS:-127.0.0.1}:${MAILPIT_INTERFACE_PORT}:8025"
    networks:
      - app-network

  minio:
    <<: *service-defaults
    container_name: minio
    image: minio/minio:RELEASE.2024-03-07T00-43-48Z
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9005}:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network

  minio-init:
    container_name: minio-init
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app-network
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /usr/bin/mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        /usr/bin/mc mb --ignore-existing -p local/evogym-bucket
        /usr/bin/mc anonymous set none local/evogym-bucket
        echo 'MinIO is fully configured!'

  frontend:
    <<: *service-defaults
    container_name: frontend
    build:
      context: "nextjs"
      dockerfile: ../docker/dockerfiles/node/Dockerfile
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NEXT_PORT}:3000"
    working_dir: /app
    volumes:
      - ./nextjs:/app
      - frontend_node_modules:/app/node_modules
      - pnpm-store:/app/.pnpm-store
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgadmin_data:
  frontend_node_modules:
  pnpm-store:
  rabbitmq_data:
  clickhouse_data:

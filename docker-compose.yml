services:
  nginx:
    container_name: nginx
    image: openresty/openresty:1.29.2.1-alpine
    command: /bin/sh -c "mkdir -p /var/cache/nginx/fastcgi && openresty -g 'daemon off;'"
    volumes:
      - ./symfony:/var/www
      - ./docker/conf/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "${NGINX_PORT}:80"
    restart: always
    depends_on:
      - php-fpm
      - postgres
    networks:
      - app-network

  php-fpm:
    container_name: php
    build:
      context: "docker/dockerfiles/php"
      dockerfile: Dockerfile
    restart: always
    working_dir: /var/www
    volumes:
      - ./symfony:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - XDEBUG_MODE=${XDEBUG_MODE}
      - XDEBUG_CONFIG=${XDEBUG_CONFIG}
      - XDEBUG_CLIENT_HOST=${XDEBUG_CLIENT_HOST}
      - PHP_IDE_CONFIG=${PHP_IDE_CONFIG}
    networks:
      - app-network

  postgres:
    container_name: postgres
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}" ]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./docker/db/data:/var/lib/postgresql/data:rw
    networks:
      - app-network

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:9.12.0
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - app-network

  redis:
    container_name: redis
    image: redis:8.6.0-alpine
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - app-network

  frontend:
    container_name: frontend
    build:
      context: "nextjs"
      dockerfile: ../docker/dockerfiles/node/Dockerfile
    restart: always
    ports:
      - "${NEXT_PORT}:3000"
    working_dir: /app
    volumes:
      - ./nextjs:/app
      - /app/node_modules
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgadmin_data:
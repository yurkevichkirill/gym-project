x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging

x-php-runtime-environment: &php-runtime-environment
  APP_ENV: ${APP_ENV:-prod}
  APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
  APP_SHARE_DIR: /var/www
  DEFAULT_URI: ${DEFAULT_URI:-https://localhost}
  CLIENT_ACTIVATION_URL: ${CLIENT_ACTIVATION_URL:-https://evogym.local/activate/}
  ACTIVATION_EMAIL_SENDER: ${ACTIVATION_EMAIL_SENDER:-noreply@evogym.local}
  AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-.evogym.local}
  CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https://evogym\.local$}
  DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gym_database}?serverVersion=16&charset=utf8}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379?timeout=1&read_write_timeout=1}
  MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-amqp://${RABBITMQ_DEFAULT_USER:-user}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/%2f/messages}
  MAILER_DSN: ${MAILER_DSN:-smtp://mailpit:1025}
  CONTACT_RECIPIENT_EMAIL: ${CONTACT_RECIPIENT_EMAIL:-contact@evogym.local}
  CONTACT_SENDER_EMAIL: ${CONTACT_SENDER_EMAIL:-noreply@evogym.local}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-%kernel.project_dir%/config/jwt/private.pem}
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-%kernel.project_dir%/config/jwt/public.pem}
  JWT_PASSPHRASE: ${JWT_PASSPHRASE:?JWT_PASSPHRASE is required}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
  STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:?STRIPE_PUBLIC_KEY is required}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
  CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-http://clickhouse:8123/}
  CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-analytics}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER}}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
  MINIO_BUCKET: ${MINIO_BUCKET:-evogym-bucket}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}

services:
  nginx:
    <<: *service-defaults
    container_name: nginx
    image: openresty/openresty:1.29.2.1-alpine
    command: /bin/sh -c "mkdir -p /var/cache/nginx/fastcgi && openresty -g 'daemon off;'"
    volumes:
      - ./symfony:/var/www
      - ./docker/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${SECURE_NGINX_PORT}:443"
    depends_on:
      php-fpm:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - app-network

  php-fpm:
    <<: *service-defaults
    container_name: php
    build:
      context: "docker/dockerfiles/php"
      dockerfile: Dockerfile
    working_dir: /var/www
    volumes:
      - ./symfony:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *php-runtime-environment
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CONFIG: ${XDEBUG_CONFIG:-client_host=host.docker.internal}
      XDEBUG_CLIENT_HOST: ${XDEBUG_CLIENT_HOST:-host.docker.internal}
      PHP_IDE_CONFIG: ${PHP_IDE_CONFIG:-serverName=docker-cli}
    networks:
      - app-network

  postgres:
    <<: *service-defaults
    container_name: postgres
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT}:5432"
    volumes:
      - ./docker/db/data:/var/lib/postgresql/data:rw
    networks:
      - app-network


  redis:
    <<: *service-defaults
    container_name: redis
    image: redis:8.6.0-alpine
    command: [ "redis-server", "--appendonly", "yes", "--appendfsync", "everysec" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT}:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - app-network

  rabbitmq:
    <<: *service-defaults
    container_name: rabbitmq
    image: rabbitmq:4.0-management-alpine
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_AMQP_PORT}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network

  messenger-worker:
    <<: *service-defaults
    container_name: messenger-worker
    build:
      context: "docker/dockerfiles/php"
      dockerfile: Dockerfile
    working_dir: /var/www
    command: >
      php bin/console messenger:consume async client_outbox cache_outbox
      --time-limit=3600
      --memory-limit=256M
      --limit=1000
      -vv
    volumes:
      - ./symfony:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *php-runtime-environment
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CONFIG: ${XDEBUG_CONFIG:-client_host=host.docker.internal}
      XDEBUG_CLIENT_HOST: ${XDEBUG_CLIENT_HOST:-host.docker.internal}
      PHP_IDE_CONFIG: ${PHP_IDE_CONFIG:-serverName=docker-cli}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  analytics-worker:
    <<: *service-defaults
    container_name: analytics-worker
    build:
      context: "docker/dockerfiles/php"
      dockerfile: Dockerfile
    working_dir: /var/www
    command: >
      php bin/console messenger:consume analytics
      --time-limit=3600
      --memory-limit=256M
      --limit=1000
      -vv
    volumes:
      - ./symfony:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *php-runtime-environment
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CONFIG: ${XDEBUG_CONFIG:-client_host=host.docker.internal}
      XDEBUG_CLIENT_HOST: ${XDEBUG_CLIENT_HOST:-host.docker.internal}
      PHP_IDE_CONFIG: ${PHP_IDE_CONFIG:-serverName=docker-cli}
    depends_on:
      rabbitmq:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - app-network

  scheduler-worker:
    <<: *service-defaults
    container_name: scheduler-worker
    build:
      context: "docker/dockerfiles/php"
      dockerfile: Dockerfile
    working_dir: /var/www
    command: >
      php bin/console messenger:consume scheduler_default scheduler_memberships
      --time-limit=3600
      --memory-limit=256M
      -vv
    volumes:
      - ./symfony:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *php-runtime-environment
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CONFIG: ${XDEBUG_CONFIG:-client_host=host.docker.internal}
      XDEBUG_CLIENT_HOST: ${XDEBUG_CLIENT_HOST:-host.docker.internal}
      PHP_IDE_CONFIG: ${PHP_IDE_CONFIG:-serverName=docker-cli}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  payment-worker:
    <<: *service-defaults
    container_name: payment-worker
    build:
      context: "docker/dockerfiles/php"
      dockerfile: Dockerfile
    working_dir: /var/www
    command: >
      php bin/console messenger:consume payment_outbox
      --time-limit=3600
      --memory-limit=256M
      -vv
    volumes:
      - ./symfony:/var/www
    environment:
      <<: *php-runtime-environment
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  clickhouse:
    <<: *service-defaults
    container_name: clickhouse
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?CLICKHOUSE_USER is required}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - app-network


  minio:
    <<: *service-defaults
    container_name: minio
    image: minio/minio:RELEASE.2024-03-07T00-43-48Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network


  frontend:
    <<: *service-defaults
    container_name: frontend
    build:
      context: "nextjs"
      dockerfile: ../docker/dockerfiles/node/Dockerfile
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NEXT_PORT}:3000"
    working_dir: /app
    volumes:
      - ./nextjs:/app
      - frontend_node_modules:/app/node_modules
      - pnpm-store:/app/.pnpm-store
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  frontend_node_modules:
  pnpm-store:
  rabbitmq_data:
  clickhouse_data:

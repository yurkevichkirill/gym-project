name: evogym-prod

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  networks:
    - app-network

x-php-build: &php-build
  context: .
  dockerfile: docker/dockerfiles/php/Dockerfile
  target: prod

x-php-environment: &php-environment
  APP_ENV: prod
  APP_DEBUG: "0"
  APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
  APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
  APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
  APP_SHARE_DIR: /var/www
  DEFAULT_URI: ${DEFAULT_URI:?DEFAULT_URI is required}
  CLIENT_ACTIVATION_URL: ${CLIENT_ACTIVATION_URL:?CLIENT_ACTIVATION_URL is required}
  AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:?AUTH_COOKIE_DOMAIN is required}
  CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?CORS_ALLOW_ORIGIN is required}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379?timeout=1&read_write_timeout=1}
  MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:?MESSENGER_TRANSPORT_DSN is required}
  MAILER_DSN: ${MAILER_DSN:?MAILER_DSN is required}
  CONTACT_RECIPIENT_EMAIL: ${CONTACT_RECIPIENT_EMAIL:?CONTACT_RECIPIENT_EMAIL is required}
  CONTACT_SENDER_EMAIL: ${CONTACT_SENDER_EMAIL:?CONTACT_SENDER_EMAIL is required}
  JWT_SECRET_KEY: /var/www/config/jwt/private.pem
  JWT_PUBLIC_KEY: /var/www/config/jwt/public.pem
  JWT_PASSPHRASE: ${JWT_PASSPHRASE:?JWT_PASSPHRASE is required}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
  STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:?STRIPE_PUBLIC_KEY is required}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
  CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-http://clickhouse:8123/}
  CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:?CLICKHOUSE_USER is required}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  MINIO_BUCKET: ${MINIO_BUCKET:-evogym-bucket}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}

x-php-service: &php-service
  image: ${PHP_IMAGE:-evogym-php:prod}
  build: *php-build
  working_dir: /var/www
  environment: *php-environment
  volumes:
    - ${JWT_KEYS_DIR:?JWT_KEYS_DIR is required}:/run/secrets/jwt:ro
  logging: *default-logging
  networks:
    - app-network

services:
  nginx:
    <<: *service-defaults
    image: ${NGINX_IMAGE:-evogym-nginx:prod}
    build:
      context: .
      dockerfile: docker/dockerfiles/nginx/Dockerfile
      target: prod
    environment:
      API_HOST: ${API_HOST:?API_HOST is required}
      FRONTEND_HOST: ${FRONTEND_HOST:?FRONTEND_HOST is required}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ${TLS_CERTS_DIR:?TLS_CERTS_DIR is required}:/etc/nginx/certs:ro
    depends_on:
      php-fpm:
        condition: service_started
      frontend:
        condition: service_started
      redis:
        condition: service_healthy

  php-fpm:
    <<: [*service-defaults, *php-service]
    command: [php-fpm]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  migrate:
    <<: *php-service
    profiles: [release]
    restart: "no"
    command: [migrate]
    depends_on:
      postgres:
        condition: service_healthy

  messenger-worker:
    <<: [*service-defaults, *php-service]
    command: [php, bin/console, messenger:consume, async, client_outbox, cache_outbox, --time-limit=3600, --memory-limit=256M, --limit=1000, -vv]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  analytics-worker:
    <<: [*service-defaults, *php-service]
    command: [php, bin/console, messenger:consume, analytics, --time-limit=3600, --memory-limit=256M, --limit=1000, -vv]
    depends_on:
      rabbitmq:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  scheduler-worker:
    <<: [*service-defaults, *php-service]
    command: [php, bin/console, messenger:consume, scheduler_default, scheduler_memberships, --time-limit=3600, --memory-limit=256M, -vv]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-worker:
    <<: [*service-defaults, *php-service]
    command: [php, bin/console, messenger:consume, payment_outbox, --time-limit=3600, --memory-limit=256M, -vv]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    <<: *service-defaults
    image: ${FRONTEND_IMAGE:-evogym-frontend:prod}
    build:
      context: nextjs
      dockerfile: ../docker/dockerfiles/node/Dockerfile
      target: prod
      args:
        INTERNAL_API_URL: http://nginx:8080/api
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:?NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY is required}
    environment:
      INTERNAL_API_URL: http://nginx:8080/api

  postgres:
    <<: *service-defaults
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-backup:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    profiles: [backup]
    restart: "no"
    logging: *default-logging
    entrypoint: [/bin/sh, /usr/local/bin/postgres-backup]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ${POSTGRES_BACKUP_DIR:?POSTGRES_BACKUP_DIR is required}:/backups
      - ./docker/postgres/backup.sh:/usr/local/bin/postgres-backup:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app-network]

  postgres-restore:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    profiles: [restore]
    restart: "no"
    logging: *default-logging
    entrypoint: [/bin/sh, /usr/local/bin/postgres-restore]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_DIR: /backups
      BACKUP_FILE: ${BACKUP_FILE:-}
      ALLOW_DATABASE_RESTORE: ${ALLOW_DATABASE_RESTORE:-0}
    volumes:
      - ${POSTGRES_BACKUP_DIR:?POSTGRES_BACKUP_DIR is required}:/backups:ro
      - ./docker/postgres/restore.sh:/usr/local/bin/postgres-restore:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app-network]

  redis:
    <<: *service-defaults
    image: redis:8.6.0-alpine
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  rabbitmq:
    <<: *service-defaults
    image: rabbitmq:4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  clickhouse:
    <<: *service-defaults
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?CLICKHOUSE_USER is required}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  minio:
    <<: *service-defaults
    image: minio/minio:RELEASE.2024-03-07T00-43-48Z
    ports:
      - "127.0.0.1:9005:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - minio_data:/data
    command: [server, /data]

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-evogym-bucket}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /usr/bin/mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        /usr/bin/mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        /usr/bin/mc anonymous set download "local/$${MINIO_BUCKET}"
    networks: [app-network]

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  clickhouse_data:
  minio_data:
